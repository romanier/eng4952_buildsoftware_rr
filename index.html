<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streaks: Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN / REGISTER -->
  <main id="auth-view" class="auth" hidden>
    <div class="auth-card">
      <h1 class="brand">Streaks</h1>
      <p class="tagline">Tick off one habit a day. Watch the row fill up.</p>

      <div class="tabs" role="tablist">
        <button id="tab-login" class="tab active" role="tab" type="button">Log in</button>
        <button id="tab-register" class="tab" role="tab" type="button">Create account</button>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password (6+ characters)</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>

      <p id="auth-message" class="message" role="alert"></p>
      <button id="auth-submit" class="btn primary" type="button">Log in</button>
    </div>
  </main>

  <!-- APP -->
  <div id="app-view" hidden>
    <header class="topbar">
      <span class="brand small">Streaks</span>
      <div class="who">
        <span id="user-email"></span>
        <button id="logout" class="btn ghost" type="button">Log out</button>
      </div>
    </header>

    <main class="page">
      <section class="add">
        <label class="sr-only" for="new-habit">New habit</label>
        <input id="new-habit" type="text" maxlength="60" placeholder="New habit, e.g. Read 20 pages">
        <button id="add-habit" class="btn primary" type="button">Add habit</button>
      </section>

      <section class="weekbar">
        <button id="prev-week" class="btn ghost" type="button" aria-label="Previous week">&larr;</button>
        <h2 id="week-label"></h2>
        <button id="next-week" class="btn ghost" type="button" aria-label="Next week">&rarr;</button>
        <button id="this-week" class="btn ghost" type="button">Today</button>
      </section>

      <p id="app-message" class="message" role="alert"></p>

      <section id="habit-list" class="habits" aria-live="polite"></section>
      <p id="empty" class="empty" hidden>No habits yet. Add your first one above.</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
